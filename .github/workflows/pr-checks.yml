# SPDX-License-Identifier: GPL-3.0-or-later
name: PR Checks

on:
  pull_request:
    branches:
      - main
      - master
      - 'AppManager-*'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run app lint
        run: ./gradlew :app:lintFlossDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-floss-debug
          path: app/build/reports/lint-results-flossDebug.html
          if-no-files-found: warn

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run app unit tests
        run: ./gradlew :app:testFlossDebugUnitTest
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-floss-debug
          path: app/build/reports/tests/testFlossDebugUnitTest/
          if-no-files-found: warn

  permission-parity:
    name: Manifest ↔ Docs Permission Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check manifest permissions match docs catalogue
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          CATALOGUE="docs/policy/permissions.md"
          # Extract android.permission.* names from the manifest
          manifest_perms=$(grep -oP 'android:name="android\.permission\.\K[A-Z_]+' "$MANIFEST" | sort -u)
          # Extract all ALL_CAPS permission names mentioned anywhere in the catalogue
          catalogue_perms=$(grep -oP '`([A-Z][A-Z_]+)`' "$CATALOGUE" | tr -d '`' | sort -u)
          missing=$(comm -23 <(echo "$manifest_perms") <(echo "$catalogue_perms"))
          rc=0
          if [ -n "$missing" ]; then
            echo "::error::Manifest permissions missing from docs/policy/permissions.md:"
            echo "$missing" | while read p; do echo "  - $p"; done
            rc=1
          fi
          exit $rc

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0, CC-BY-NC-1.0, CC-BY-NC-2.0, CC-BY-NC-2.5, CC-BY-NC-3.0, CC-BY-NC-4.0, CC-BY-NC-SA-1.0, CC-BY-NC-SA-2.0, CC-BY-NC-SA-2.5, CC-BY-NC-SA-3.0, CC-BY-NC-SA-4.0, CC-BY-ND-4.0, CC-BY-NC-ND-4.0
          comment-summary-in-pr: on-failure
